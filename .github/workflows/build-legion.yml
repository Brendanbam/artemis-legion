name: Build Artemis Legion

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEGION_BUILD: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.LEGION_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout (with moonlight-common-c submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973" > /dev/null

      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.LEGION_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/legion.jks"
          echo "LEGION_KEYSTORE_PATH=$RUNNER_TEMP/legion.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          LEGION_KEYSTORE_PASSWORD: ${{ secrets.LEGION_KEYSTORE_PASSWORD }}
          LEGION_KEY_ALIAS: ${{ secrets.LEGION_KEY_ALIAS }}
          LEGION_KEY_PASSWORD: ${{ secrets.LEGION_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRoot_gameRelease -PlegionBuild=${LEGION_BUILD} --stacktrace

      - name: Collect arm64 APK
        run: |
          APK=$(find app/build/outputs/apk/nonRoot_game/release -name "*arm64-v8a*.apk" | head -n1)
          echo "Built: $APK"
          test -n "$APK"
          mkdir -p out
          cp "$APK" "out/ArtemisLegion-v20.3.0-legion.${LEGION_BUILD}-arm64-v8a.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtemisLegion-arm64
          path: out/*.apk

      # Signed builds on main become GitHub Releases so Obtainium can auto-update
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && env.LEGION_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v20.3.0-legion.${LEGION_BUILD}"
          gh release create "$TAG" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Artemis Legion ${TAG}" \
            --notes "Automatic build from commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
