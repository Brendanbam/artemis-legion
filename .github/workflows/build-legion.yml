name: Build Artemis Legion

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEGION_BUILD: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.LEGION_KEYSTORE_PASSWORD != '' }}

    steps:
      - name: Checkout (with moonlight-common-c submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Use the Android SDK preinstalled on GitHub's runner
      - name: Install NDK
        timeout-minutes: 8
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          if [ -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then echo "NDK already installed"; exit 0; fi
          yes | "$SDKM" --install "ndk;27.0.12077973" > /dev/null

      # The keystore in signing/ is encrypted; it is only usable with the LEGION_KEYSTORE_PASSWORD secret
      - name: Use signing key
        if: env.HAS_KEY == 'true'
        run: echo "LEGION_KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/legion-release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          LEGION_KEYSTORE_PASSWORD: ${{ secrets.LEGION_KEYSTORE_PASSWORD }}
          LEGION_KEY_ALIAS: legion
          LEGION_KEY_PASSWORD: ${{ secrets.LEGION_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRoot_gameRelease -PlegionBuild=${LEGION_BUILD} --stacktrace

      - name: Collect arm64 APK
        run: |
          APK=$(find app/build/outputs/apk/nonRoot_game/release -name "*arm64-v8a*.apk" | head -n1)
          echo "Built: $APK"
          test -n "$APK"
          mkdir -p out
          cp "$APK" "out/ArtemisLegion-v20.3.0-legion.${LEGION_BUILD}-arm64-v8a.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtemisLegion-arm64
          path: out/*.apk

      # Signed builds on main become GitHub Releases so Obtainium can auto-update
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && env.LEGION_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v20.3.0-legion.${LEGION_BUILD}"
          gh release create "$TAG" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Artemis Legion ${TAG}" \
            --notes "Automatic build from commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
